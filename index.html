<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1d2127;--muted:#5d636c;--line:#e0ddd6;--soft:#f0eee9;
  --accent:#8a1c24;--accent-soft:#f6e4e2;--ok:#2f7a4a;--part:#b26b12;--miss:#9aa0a8;--bar:#c9c4ba;--me:#8a1c24;
  --f-body:"Sarabun",system-ui,sans-serif;--f-head:"Anuphan","Sarabun",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171a;--card:#1e2125;--ink:#e9e7e3;--muted:#a3a8b0;--line:#33373d;--soft:#262a2f;
  --accent:#f08a8f;--accent-soft:#3a2224;--ok:#6cc58f;--part:#e8a54d;--miss:#6c727a;--bar:#4a4f57;--me:#f08a8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1e2125;--ink:#e9e7e3;--muted:#a3a8b0;--line:#33373d;--soft:#262a2f;
  --accent:#f08a8f;--accent-soft:#3a2224;--ok:#6cc58f;--part:#e8a54d;--miss:#6c727a;--bar:#4a4f57;--me:#f08a8f;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body)}
.wrap{max-width:760px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 56px max(16px,env(safe-area-inset-right))}
header{margin:8px 0 18px}
.eyebrow{font:600 .8rem/1.4 var(--f-head);letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
h1{font:700 1.55rem/1.3 var(--f-head);margin:4px 0 2px}
h2{font:700 1.15rem/1.35 var(--f-head);margin:0 0 10px}
h3{font:600 1rem/1.4 var(--f-head);margin:0}
.sub{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{width:100%;font:500 1.15rem var(--f-body);letter-spacing:.06em;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:600 1rem var(--f-head);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1d1012}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#1d1012}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--accent);font-weight:600;margin-top:10px;min-height:1.5em}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.big{font:700 2.6rem/1 var(--f-head)}
.big small{font-size:1rem;color:var(--muted);font-weight:500}
.gradebox{text-align:center;border-radius:12px;background:var(--accent-soft);color:var(--accent);padding:10px 18px;min-width:96px}
.gradebox .g{font:700 2.2rem/1 var(--f-head)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kv div{background:var(--soft);border-radius:10px;padding:8px 10px}
.kv b{display:block;font:700 1.1rem var(--f-head)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0 4px}
.stats div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.88rem;color:var(--muted)}
.stats b{display:block;color:var(--ink);font:600 1rem var(--f-head)}
svg text{fill:var(--muted);font:12px var(--f-body)}
.meter{margin:10px 0 14px}
.meter .top{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.track{position:relative;height:12px;border-radius:999px;background:var(--soft);margin-top:4px;overflow:visible}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.sdband{position:absolute;top:-3px;bottom:-3px;background:var(--bar);opacity:.45;border-radius:4px}
.mean{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
details.q{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
details.q>summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary .sc{font:700 1.15rem var(--f-head);text-align:right;white-space:nowrap}
details.q>summary .sc span{display:inline-block;margin-left:8px;padding:0 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
details.q[open]>summary{border-bottom:1px solid var(--line)}
.qbody{padding:14px 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.chip{background:var(--soft);border-radius:999px;padding:2px 12px;font-size:.88rem}
.issue{border-top:1px dashed var(--line);padding:12px 0}
.issue:first-of-type{border-top:0}
.ihead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ig{font:700 1.05rem var(--f-head);color:var(--accent);white-space:nowrap}
.cl{background:var(--soft);border-left:3px solid var(--accent);border-radius:6px;padding:8px 10px;margin:8px 0;font-size:.93rem}
.cl b{display:block;font:600 .8rem var(--f-head);color:var(--muted)}
ul.ex{list-style:none;padding:0;margin:6px 0}
ul.ex li{display:grid;grid-template-columns:18px 1fr;gap:8px;margin:6px 0;font-size:.93rem}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;border:2px solid var(--miss)}
.dot.y{background:var(--ok);border-color:var(--ok)}
.dot.p{background:linear-gradient(90deg,var(--part) 50%,transparent 50%);border-color:var(--part)}
.ex .add{color:var(--muted);font-size:.86rem}
.ex .nt{display:block;color:var(--muted);font-size:.86rem}
.miss{color:var(--accent);font-size:.9rem;margin:4px 0 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.note{background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-top:10px}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hidden{display:none!important}
@media (max-width:480px){.big{font-size:2.2rem}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.kv b{font-size:1rem}}
@media print{body{background:#fff;color:#000}.foot,#loginCard,.noprint{display:none!important}details.q{break-inside:avoid}.card,details.q{border-color:#bbb}}
</style>
</head>

const STATS={"n": 76, "mean": 72.06697368421052, "sd": 9.416701188808013, "median": 73.615, "min": 40.032000000000004, "max": 92.74199999999999, "full": 100, "cwt": 30, "hist": [0, 0, 0, 0, 0, 1, 3, 10, 19, 28, 13, 2, 0], "bw": 8, "grades": [["A", 3], ["A-", 12], ["B+", 18], ["B", 13], ["B-", 12], ["C+", 11], ["C", 3], ["D+", 2], ["D", 1], ["F", 1]], "q": [{"id": "q1", "short": "ข้อ 1", "label": "ข้อ 1 ความครอบคลุม 3 มิติ", "full": 20, "mean": 14.415947368421053, "sd": 2.7414781409292655}, {"id": "q2", "short": "ข้อ 2", "label": "ข้อ 2 ประสิทธิภาพเชิงพลวัตกับความเป็นธรรมระหว่างรุ่น", "full": 20, "mean": 12.63971052631579, "sd": 4.1023379051976026}, {"id": "q3", "short": "ข้อ 3", "label": "ข้อ 3 ประกันสุขภาพถ้วนหน้า: public goods หรือ CPR", "full": 20, "mean": 16.046131578947367, "sd": 3.133838682689779}, {"id": "q4", "short": "ข้อ 4", "label": "ข้อ 4 บริการระบบนิเวศและ PES", "full": 20, "mean": 12.308605263157895, "sd": 2.896017956108916}, {"id": "q5", "short": "ข้อ 5", "label": "ข้อ 5 ความเข้าใจที่เพิ่มขึ้นจากวิชาและ PBL", "full": 20, "mean": 16.65657894736842, "sd": 1.8614987170783146}], "scale": [["A", 100, "สมบูรณ์ ทฤษฎีชัด"], ["A-", 94, "ทฤษฎีชัดพอสมควร"], ["B+", 88, "มีทฤษฎีเล็กน้อย"], ["B", 82, "ขยายความเชิงพรรณนา"], ["B-", 76, "ถูก ไม่ขยายความ"], ["C+", 70, "ผิด ทฤษฎีดี"], ["C", 64, "ผิด ทฤษฎีบางส่วน"], ["C-", 58, "ผิด พรรณนา"], ["D+", 52, "ผิดสิ้นเชิง มีความพยายาม"], ["D", 46, "ผิดสิ้นเชิง ไม่พยายาม"], ["D-", 40, "เขียนน้อยมาก"], ["F", 0, "ไม่ได้ตอบ"]], "bands": [[85, "A"], [80, "A-"], [75, "B+"], [70, "B"], [65, "B-"], [60, "C+"], [55, "C"], [52.5, "D+"], [50, "D"], [0, "F"]], "wc": 90, "ww": 10, "wp": [["ดีมาก", 100], ["ดี", 80], ["พอใช้", 60], ["ไม่ได้เขียนตอบ", 0]]};
const PREFIX="EC465-midterm1-2569", ITER=150000;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f2=x=>Number(x).toFixed(2), f1=x=>Number(x).toFixed(1);
const te=new TextEncoder();
async function sha256hex(s){const b=await crypto.subtle.digest("SHA-256",te.encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function openRec(sid){
  const idx=(await sha256hex(PREFIX+"|"+sid)).slice(0,20); const blob=DATA[idx]; if(!blob) return null;
  const raw=Uint8Array.from(atob(blob),c=>c.charCodeAt(0)); const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const base=await crypto.subtle.importKey("raw",te.encode(sid+":"),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const gz=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt);
}
function hist(rec){
  const S=STATS, n=S.hist.length, W=640, H=170, pl=30, pb=26, bw=(W-pl-8)/n, mx=Math.max(...S.hist,1);
  const mine=Math.min(n-1,Math.floor(rec.raw/S.bw));
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="การกระจายคะแนนรวมของทั้งชั้น ช่องที่เน้นคือช่วงคะแนนของคุณ">`;
  for(let t=0;t<=mx;t+=Math.max(1,Math.ceil(mx/4))){const y=H-pb-(t/mx)*(H-pb-10);g+=`<line x1="${pl}" x2="${W-8}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${t}</text>`;}
  S.hist.forEach((c,i)=>{const h=(c/mx)*(H-pb-10), x=pl+i*bw+2, y=H-pb-h;
    g+=`<rect x="${x}" y="${y}" width="${bw-4}" height="${h}" rx="3" fill="${i===mine?"var(--me)":"var(--bar)"}"><title>${i*S.bw}–${Math.min(S.full,(i+1)*S.bw)} คะแนน: ${c} คน</title></rect>`;
    if(c) g+=`<text x="${x+(bw-4)/2}" y="${y-4}" text-anchor="middle">${c}</text>`;
    if(i%2===0) g+=`<text x="${pl+i*bw}" y="${H-8}" text-anchor="middle">${i*S.bw}</text>`;});
  g+=`<text x="${W-8}" y="${H-8}" text-anchor="end">${S.full}</text></svg>`;
  return g;
}
function meter(q,sq){
  const p=v=>Math.max(0,Math.min(100,v/q.full*100));
  return `<div class="meter"><div class="top"><span>${esc(q.short)}</span><span><b>${f2(q.raw)}</b> / ${q.full} <span class="sub">· เฉลี่ยชั้น ${f2(sq.mean)} (S.D. ${f2(sq.sd)})</span></span></div>
  <div class="track"><div class="sdband" style="left:${p(sq.mean-sq.sd)}%;width:${p(sq.mean+sq.sd)-p(sq.mean-sq.sd)}%"></div><div class="fill" style="width:${p(q.raw)}%"></div><div class="mean" style="left:${p(sq.mean)}%"></div></div></div>`;
}
const STL={y:"พบในคำตอบ",p:"พบบางส่วน",n:"ไม่พบ"};
function qDetail(q){
  const iss=q.iss.map(i=>`<div class="issue">
    <div class="ihead"><h3>${esc(i.l)}</h3><span class="ig">${i.g==="NA"?"ไม่ได้ยก":esc(i.g)}${i.gp!=null?` <span class="sub">(${i.gp}%)</span>`:""}</span></div>
    <div class="sub">${i.opt?"ประเด็นที่ยกขึ้นเอง (ไม่ได้ยกไม่นับ)":"น้ำหนักในข้อ "+i.w}</div>
    ${i.cl&&i.g!=="NA"?`<div class="cl"><b>ลักษณะคำตอบที่ได้ระดับนี้</b>${esc(i.cl)}</div>`:""}
    ${i.ex.length?`<ul class="ex">${i.ex.map(x=>`<li><span class="dot ${x.s}" role="img" aria-label="${STL[x.s]||""}" title="${STL[x.s]||""}"></span><span>${x.a?`<span class="add">จุดเสริม: </span>`:""}${esc(x.t)}${x.n?`<span class="nt">${esc(x.n)}</span>`:""}</span></li>`).join("")}</ul>`:""}
    ${i.m.length?`<p class="miss">สิ่งที่ยังขาด: ${i.m.map(esc).join(" · ")}</p>`:""}
  </div>`).join("");
  return `<details class="q"><summary><div><h3>${esc(q.label)}</h3><span class="sub">คลิกดูรายละเอียดรายประเด็น</span></div><div class="sc">${f2(q.raw)}<span>${esc(q.gr)}</span></div></summary>
   <div class="qbody">
    <div class="chips"><span class="chip">ร้อยละของข้อ ${f1(q.pct)}</span><span class="chip">ระดับรายประเด็นเฉลี่ย ${f1(q.acc)}%</span><span class="chip">การเขียน: ${esc(q.wl)} (${q.wp}%)</span></div>
    ${q.wr?`<p class="sub">ความเห็นต่อการเขียน: ${esc(q.wr)}</p>`:""}
    ${q.kn.length?`<p class="sub">แนวคิดที่ใช้ในคำตอบ: ${q.kn.map(esc).join(", ")}</p>`:""}
    ${iss}
    ${q.note?`<div class="note"><b>หมายเหตุจากผู้สอน:</b> ${esc(q.note)}</div>`:""}
    <p class="sub" style="margin-top:10px"><span class="dot y" style="display:inline-block;vertical-align:-1px"></span> พบในคำตอบ &nbsp; <span class="dot p" style="display:inline-block;vertical-align:-1px"></span> พบบางส่วน &nbsp; <span class="dot" style="display:inline-block;vertical-align:-1px"></span> ไม่พบ</p>
   </div></details>`;
}
function render(rec){
  const S=STATS;
  $("#out").innerHTML=`<section class="card">
    <div class="sub">${esc(rec.sid)} · ${esc(rec.name)}</div>
    <div class="hero"><div><div class="sub">คะแนนรวม</div><div class="big">${f2(rec.raw)} <small>/ ${S.full}</small></div></div>
      <div class="gradebox"><div class="sub" style="color:inherit">เกรด</div><div class="g">${esc(rec.gr)}</div></div></div>
    <div class="kv"><div>ร้อยละ<b>${f2(rec.pct)}</b></div><div>คะแนนเก็บ<b>${f2(rec.cw)} / ${S.cwt}</b></div><div>เฉลี่ยชั้น<b>${f2(S.mean)}</b></div></div>
  </section>
  <section class="card"><h2>เทียบกับทั้งชั้น</h2>
    <div class="stats"><div>จำนวนผู้เข้าสอบ<b>${S.n} คน</b></div><div>ค่าเฉลี่ย<b>${f2(S.mean)}</b></div><div>ส่วนเบี่ยงเบนมาตรฐาน (S.D.)<b>${f2(S.sd)}</b></div><div>มัธยฐาน<b>${f2(S.median)}</b></div><div>สูงสุด<b>${f2(S.max)}</b></div><div>ต่ำสุด<b>${f2(S.min)}</b></div></div>
    ${hist(rec)}
    <div class="legend"><span><i style="background:var(--me)"></i>ช่วงคะแนนของคุณ</span><span><i style="background:var(--bar)"></i>จำนวนคนในแต่ละช่วง ${S.bw} คะแนน</span></div>
    <h3 style="margin-top:16px">รายข้อ</h3>
    ${rec.q.map((q,i)=>meter(q,S.q[i])).join("")}
    <div class="legend"><span><i style="background:var(--accent)"></i>คะแนนของคุณ</span><span><i style="background:var(--ink);width:3px"></i>ค่าเฉลี่ยชั้น</span><span><i style="background:var(--bar);opacity:.6"></i>ช่วงค่าเฉลี่ย ± 1 S.D.</span></div>
    <h3 style="margin-top:16px">จำนวนนักศึกษาตามเกรด</h3>
    <table><thead><tr>${S.grades.map(g=>`<th class="n">${g[0]}</th>`).join("")}</tr></thead><tbody><tr>${S.grades.map(g=>`<td class="n">${g[1]}</td>`).join("")}</tr></tbody></table>
  </section>
  <h2 style="margin:18px 0 10px">รายละเอียดรายข้อ</h2>
  ${rec.q.map(qDetail).join("")}
  <div class="foot"><button class="btn" onclick="window.print()">พิมพ์ / บันทึกเป็น PDF</button><button class="btn" id="exit">ออก</button></div>`;
  $("#loginCard").classList.add("hidden"); $("#out").classList.remove("hidden");
  $("#exit").onclick=()=>{ $("#out").innerHTML=""; $("#out").classList.add("hidden"); $("#loginCard").classList.remove("hidden"); $("#sid").value=""; $("#sid").focus(); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}
function method(){
  const S=STATS;
  $("#methodBody").innerHTML=`<p>ข้อสอบมี ${S.q.length} ข้อ ข้อละ ${S.q[0].full} คะแนน รวม ${S.full} คะแนน ในแต่ละข้อ ผู้สอนให้ระดับ A ถึง F แยกตามประเด็นที่โจทย์ถาม แล้วแปลงเป็นร้อยละตามตารางด้านล่าง</p>
  <ul><li>ส่วนระดับรายประเด็น ${S.wc}% = ค่าเฉลี่ยถ่วงน้ำหนักของร้อยละรายประเด็น (ข้อ 5 นับเฉพาะประเด็นที่ยกขึ้นมา)</li>
  <li>ส่วนการเขียนเรียบเรียง ${S.ww}% = ${S.wp.map(w=>`${w[0]} ${w[1]}%`).join(" · ")}</li>
  <li>คะแนนของข้อ = ร้อยละของข้อ × คะแนนเต็มของข้อ ÷ 100 · คะแนนรวม = ผลรวมทุกข้อ</li>
  <li>คะแนนเก็บ = คะแนนรวม ÷ ${S.full} × ${S.cwt} (การสอบนี้คิดเป็น ${S.cwt}% ของรายวิชา)</li></ul>
  <table><thead><tr><th>ระดับ</th><th class="n">ร้อยละ</th><th>ความหมายโดยย่อ</th></tr></thead><tbody>${S.scale.map(s=>`<tr><td><b>${s[0]}</b></td><td class="n">${s[1]}</td><td>${esc(s[2])}</td></tr>`).join("")}</tbody></table>
  <p class="sub" style="margin-top:10px">เกณฑ์เกรด (ใช้ทั้งรายข้อและคะแนนรวม, ร้อยละขั้นต่ำ): ${S.bands.map(b=>`${b[1]} ≥ ${b[0]}`).join(" · ")}</p>
  <p class="sub">S.D. คำนวณแบบตัวอย่าง (หารด้วย n − 1) จากคะแนนของผู้เข้าสอบทุกคน หากมีข้อสงสัยเกี่ยวกับคะแนน ติดต่อผู้สอนพร้อมระบุเลขทะเบียนและข้อที่ต้องการให้ทบทวน</p>`;
}
method();
$("#f").addEventListener("submit",async e=>{
  e.preventDefault(); const sid=$("#sid").value.trim(); $("#err").textContent="";
  if(!/^\d{10}$/.test(sid)){ $("#err").textContent="กรุณากรอกเลขทะเบียน 10 หลัก"; return; }
  if(!window.crypto?.subtle||!window.DecompressionStream){ $("#err").textContent="เบราว์เซอร์นี้เก่าเกินไป กรุณาเปิดด้วย Chrome, Safari หรือ Edge รุ่นปัจจุบัน"; return; }
  $("#go").disabled=true; $("#busy").textContent="กำลังเปิดผลสอบ…";
  try{ const rec=await openRec(sid); if(!rec){ $("#err").textContent="ไม่พบผลสอบของเลขทะเบียนนี้ กรุณาตรวจสอบเลขทะเบียน หากถูกต้องแล้วโปรดติดต่อผู้สอน"; } else render(rec); }
  catch(x){ $("#err").textContent="เปิดผลสอบไม่สำเร็จ กรุณาลองอีกครั้ง"; }
  $("#go").disabled=false; $("#busy").textContent="";
});
